# render.yaml — четыре cron-сервиса РБХ (RBH §5.5). Файл генерируется scripts/render_blueprint.py — править там, затем --write.
# Сервисы основного кабинета (mp-analytics, mp-analytics-telegram-report) в Blueprint не входят: их конфигурация — в панели Render.
# Параметры (region, plan, runtime, состав переменных) = сервисам основного кабинета по Render API 2026-10-21. Секреты (sync: false) в git не лежат;
# сервисы создаёт scripts/render_services_sync.py через API по этому же составу (Blueprint руками не нужен).
services:
  - type: cron
    name: mp-analytics-rbh1
    # РБХ-1: ночной прогон; расписание со сдвигом +5 / +10 мин от основного кабинета (00:15 UTC)
    runtime: python
    region: oregon
    plan: standard
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    schedule: "20 0 * * *"
    startCommand: python3 run_daily_pipeline.py --skip-recovery --skip-organic --skip-telegram --skip-excel --skip-decision --ozon-campaign-selection smart_recent_active --ozon-recent-activity-days 7 --ozon-dormant-probe-size 100 --ozon-max-daily-cpc-units 1200 --ozon-allow-staged-cpc-partial
    envVars:
      - key: MP_CABINET
        value: rbh1
      - key: ENABLE_OZON_SELECTED_CPO_DAILY
        value: false
      - key: APPROVE_OZON_SELECTED_CPO_DAILY_WRITE
        value: false
      - fromGroup: rbh1
  - type: cron
    name: mp-analytics-rbh1-telegram-report
    # РБХ-1: утренний алерт в Telegram (+ книга месяца); расписание со сдвигом +5 / +10 мин от основного кабинета (07:30 UTC)
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    schedule: "35 7 * * *"
    startCommand: python3 alerts_telegram.py
    envVars:
      - key: MP_CABINET
        value: rbh1
      - fromGroup: rbh1
  - type: cron
    name: mp-analytics-rbh2
    # РБХ-2: ночной прогон; расписание со сдвигом +5 / +10 мин от основного кабинета (00:15 UTC)
    runtime: python
    region: oregon
    plan: standard
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    schedule: "25 0 * * *"
    startCommand: python3 run_daily_pipeline.py --skip-recovery --skip-organic --skip-telegram --skip-excel --skip-decision --ozon-campaign-selection smart_recent_active --ozon-recent-activity-days 7 --ozon-dormant-probe-size 100 --ozon-max-daily-cpc-units 1200 --ozon-allow-staged-cpc-partial
    envVars:
      - key: MP_CABINET
        value: rbh2
      - key: ENABLE_OZON_SELECTED_CPO_DAILY
        value: false
      - key: APPROVE_OZON_SELECTED_CPO_DAILY_WRITE
        value: false
      - fromGroup: rbh2
  - type: cron
    name: mp-analytics-rbh2-telegram-report
    # РБХ-2: утренний алерт в Telegram (+ книга месяца); расписание со сдвигом +5 / +10 мин от основного кабинета (07:30 UTC)
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    schedule: "40 7 * * *"
    startCommand: python3 alerts_telegram.py
    envVars:
      - key: MP_CABINET
        value: rbh2
      - fromGroup: rbh2
envVarGroups:
  - name: rbh1
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OZON_CLIENT_ID
        sync: false
      - key: OZON_API_KEY
        sync: false
      - key: OZON_PERFORMANCE_CLIENT_ID
        sync: false
      - key: OZON_PERFORMANCE_CLIENT_SECRET
        sync: false
      - key: WB_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OZON_PERFORMANCE_STATE_BACKEND
        value: "db"
  - name: rbh2
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OZON_CLIENT_ID
        sync: false
      - key: OZON_API_KEY
        sync: false
      - key: OZON_PERFORMANCE_CLIENT_ID
        sync: false
      - key: OZON_PERFORMANCE_CLIENT_SECRET
        sync: false
      - key: WB_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OZON_PERFORMANCE_STATE_BACKEND
        value: "db"
